<div id="world_info_control_host" class="world-info-control-host displayNone">
    <section data-world-info-control-panel class="world-info-control-panel">
        <div
            data-world-info-control-resize
            class="world-info-control-resize"
            role="separator"
            aria-label="调整世界书控制面板高度"
        ></div>
        <button
            data-world-info-control-toggle
            class="world-info-control-toggle"
            type="button"
            title="展开世界书控制"
            aria-expanded="false"
        >
            <span>
                <strong>世界书控制</strong>
                <small data-world-info-control-summary></small>
            </span>
            <i data-world-info-control-indicator class="fa-solid fa-chevron-up" aria-hidden="true"></i>
        </button>
        <div data-world-info-control-body class="world-info-control-body" hidden>
            <div class="world-info-control-toolbar">
                <input
                    data-world-info-control-search
                    class="text_pole"
                    type="search"
                    placeholder="搜索世界书或条目"
                >
                <button
                    data-world-info-control-clear
                    class="menu_button fa-solid fa-eraser"
                    type="button"
                    title="恢复当前世界书的关闭项"
                    aria-label="恢复当前世界书的关闭项"
                ></button>
                <button
                    data-world-info-control-refresh
                    class="menu_button fa-solid fa-rotate-right"
                    type="button"
                    title="重新扫描"
                    aria-label="重新扫描"
                ></button>
            </div>
            <div data-world-info-control-content class="world-info-control-content"></div>
        </div>
    </section>
</div>
