<fieldset class="toolbox-module-card" data-toolbox-module="worldInfoControl">
    <legend class="toolbox-module-legend">
        <span>世界书控制</span>
    </legend>
    <div class="toolbox-settings-row toolbox-module-enable">
        <span class="toolbox-settings-copy">
            <strong>启用模块</strong>
            <small>查看本轮触发条目并按世界书记忆关闭状态</small>
        </span>
        <label class="toolbox-switch" title="启用世界书控制">
            <input data-world-info-control-enabled type="checkbox" role="switch">
            <span class="toolbox-switch-track"></span>
        </label>
    </div>
</fieldset>
