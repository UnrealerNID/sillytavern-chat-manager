<fieldset class="toolbox-module-card" data-toolbox-module="promptViewer">
    <legend class="toolbox-module-legend">
        <span>提示词查看器</span>
    </legend>
    <div class="toolbox-settings-row toolbox-module-enable">
        <span class="toolbox-settings-copy">
            <strong>启用模块</strong>
            <small>主动获取或查看最近一次请求使用的提示词</small>
        </span>
        <label class="toolbox-switch" title="启用提示词查看器">
            <input data-prompt-viewer-enabled type="checkbox" role="switch">
            <span class="toolbox-switch-track"></span>
        </label>
    </div>
    <div data-prompt-viewer-features class="toolbox-feature-list">
        <div class="toolbox-settings-row">
            <span class="toolbox-settings-copy">
                <strong>悬浮气泡</strong>
                <small>关闭后将入口固定在输入区</small>
            </span>
            <label class="toolbox-switch" title="使用悬浮气泡">
                <input data-prompt-viewer-floating type="checkbox" role="switch">
                <span class="toolbox-switch-track"></span>
            </label>
        </div>
    </div>
</fieldset>
