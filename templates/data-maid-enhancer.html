<div id="chat_manager_data_maid_enhancer" class="cm-data-maid-root">
    <div class="cm-overlay cm-dialog-overlay cm-hidden" role="presentation" data-cm-maid-viewer>
        <section
            class="cm-dialog cm-data-maid-viewer"
            role="dialog"
            aria-modal="true"
            aria-labelledby="chat_manager_maid_viewer_title"
        >
            <header class="cm-header">
                <h3 id="chat_manager_maid_viewer_title" data-cm-maid-viewer-title>查看聊天备份</h3>
                <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-maid-viewer-close>
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </header>
            <div class="cm-result-summary" data-cm-maid-viewer-summary></div>
            <div class="cm-message-list" data-cm-maid-messages></div>
            <footer class="cm-footer cm-dialog-pagination">
                <button class="menu_button cm-icon-action" type="button" title="上一页" aria-label="上一页" data-cm-maid-message-previous>
                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                </button>
                <span data-cm-maid-message-page></span>
                <button class="menu_button cm-icon-action" type="button" title="下一页" aria-label="下一页" data-cm-maid-message-next>
                    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
            </footer>
        </section>
    </div>

    <div class="cm-overlay cm-dialog-overlay cm-hidden" role="presentation" data-cm-maid-delete-dialog>
        <section
            class="cm-dialog cm-data-maid-delete-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="chat_manager_maid_delete_title"
        >
            <header class="cm-header">
                <h3 id="chat_manager_maid_delete_title">批量删除聊天备份</h3>
                <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-maid-delete-close>
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </header>
            <div class="cm-dialog-body">
                <div class="cm-delete-notice" role="note">
                    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                    <span>确认后将永久删除所选备份。“待确认”和“未检查”并不等于孤立，请先查看内容。</span>
                </div>
                <div class="cm-delete-summary" data-cm-maid-delete-summary></div>
                <div class="cm-delete-list" data-cm-maid-delete-list></div>
                <div class="cm-dialog-actions">
                    <button class="menu_button" type="button" data-cm-maid-delete-cancel>取消</button>
                    <button class="menu_button cm-danger-action" type="button" data-cm-maid-delete-confirm>
                        <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                        <span>确认删除</span>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <template data-cm-maid-toolbar-template>
        <div class="cm-data-maid-tools">
            <div class="cm-data-maid-primary">
                <button
                    class="menu_button cm-icon-action"
                    type="button"
                    title="检查备份对应关系"
                    aria-label="检查备份对应关系"
                    data-cm-maid-scan
                >
                    <i class="fa-solid fa-link" aria-hidden="true"></i>
                </button>
                <label class="cm-search-wrap">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input class="text_pole cm-search" type="search" placeholder="搜索备份文件名" data-cm-maid-search>
                </label>
                <select class="text_pole" aria-label="备份排序" data-cm-maid-sort>
                    <option value="latest">最新优先</option>
                    <option value="oldest">最旧优先</option>
                    <option value="largest">最大优先</option>
                </select>
                <select class="text_pole" aria-label="备份状态筛选" data-cm-maid-filter>
                    <option value="all">全部备份</option>
                    <option value="orphan">仅孤立</option>
                    <option value="uncertain">仅待确认</option>
                    <option value="issues">孤立与待确认</option>
                </select>
                <button
                    class="menu_button cm-icon-action"
                    type="button"
                    title="进入批量选择"
                    aria-label="进入批量选择"
                    aria-pressed="false"
                    data-cm-maid-batch-start
                >
                    <i class="fa-solid fa-square-check" aria-hidden="true"></i>
                </button>
            </div>
            <div class="cm-data-maid-secondary">
                <span class="cm-data-maid-progress" role="status" aria-live="polite" data-cm-maid-progress>尚未检查对应关系</span>
                <div class="cm-data-maid-selection cm-hidden" role="group" aria-label="批量选择操作" data-cm-maid-selection-toolbar>
                    <span class="cm-selection-count" role="status" aria-live="polite">
                        <i class="fa-solid fa-square-check" aria-hidden="true"></i>
                        <span data-cm-maid-selected-count>已选 0 项</span>
                    </span>
                    <button
                        class="menu_button cm-icon-action"
                        type="button"
                        title="全选当前结果"
                        aria-label="全选当前结果"
                        data-cm-maid-select-all
                    >
                        <i class="fa-solid fa-check-double" aria-hidden="true"></i>
                    </button>
                    <button
                        class="menu_button cm-icon-action"
                        type="button"
                        title="取消全部选择"
                        aria-label="取消全部选择"
                        disabled
                        data-cm-maid-clear-selection
                    >
                        <i class="fa-solid fa-eraser" aria-hidden="true"></i>
                    </button>
                    <button
                        class="menu_button cm-icon-action cm-danger-action"
                        type="button"
                        title="删除已选"
                        aria-label="删除已选"
                        disabled
                        data-cm-maid-delete-selected
                    >
                        <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template data-cm-maid-controls-template>
        <div class="cm-data-maid-controls">
            <label class="cm-data-maid-select-wrap" title="选择该备份">
                <input type="checkbox" data-cm-maid-select>
            </label>
            <span class="cm-status-badge" data-state="unchecked" data-cm-maid-state>未检查</span>
            <button class="menu_button menu_button_icon margin0" type="button" title="分页查看聊天内容" aria-label="分页查看聊天内容" data-cm-maid-view>
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
        </div>
    </template>

    <template data-cm-maid-message-template>
        <article class="cm-message">
            <header class="cm-message-header">
                <strong data-cm-message-name></strong>
                <time data-cm-message-date></time>
            </header>
            <pre data-cm-message-content></pre>
        </article>
    </template>

    <template data-cm-maid-delete-template>
        <article class="cm-delete-target">
            <div class="cm-chat-info">
                <strong data-cm-delete-name></strong>
                <small data-cm-delete-facts></small>
            </div>
            <span class="cm-status-badge" data-cm-delete-state></span>
        </article>
    </template>
</div>
