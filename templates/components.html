<div data-cm-component-registry>
    <template data-cm-component="chat-row">
        <article class="cm-chat-row">
            <div class="avatar cm-chat-avatar">
                <img loading="lazy" data-cm-chat-avatar>
            </div>
            <div class="cm-chat-info">
                <div class="cm-chat-heading">
                    <div class="cm-chat-name" data-cm-chat-name>
                        <strong data-cm-chat-owner></strong>
                        <span class="cm-source-badge cm-hidden" data-cm-chat-source>源</span>
                        <span aria-hidden="true">–</span>
                        <span class="cm-file-name" data-cm-chat-file></span>
                    </div>
                    <time class="cm-chat-date" data-cm-chat-date></time>
                    <div class="cm-actions cm-chat-actions">
                        <button class="menu_button menu_button_icon cm-row-action" type="button" title="切换到该聊天记录" aria-label="进入聊天" data-cm-chat-open>
                            <i class="fa-solid fa-arrow-up-right-from-square fa-fw" aria-hidden="true"></i>
                            <span>进入聊天</span>
                        </button>
                        <button class="menu_button menu_button_icon cm-row-action" type="button" title="匹配该聊天对应的酒馆原生备份" aria-label="查找备份" data-cm-chat-backups>
                            <i class="fa-solid fa-box-archive fa-fw" aria-hidden="true"></i>
                            <span>查找备份</span>
                        </button>
                        <button class="menu_button menu_button_icon cm-row-action" type="button" title="基于原记录生成新的分卷聊天" aria-label="创建分卷" data-cm-chat-split>
                            <i class="fa-solid fa-scissors fa-fw" aria-hidden="true"></i>
                            <span>创建分卷</span>
                        </button>
                    </div>
                </div>
                <div class="cm-chat-message-row">
                    <p class="cm-chat-preview" data-cm-chat-preview></p>
                    <div class="cm-chat-stats">
                        <span data-cm-chat-count-wrap>
                            <i class="fa-solid fa-comment fa-xs" aria-hidden="true"></i>
                            <small data-cm-chat-count></small>
                        </span>
                        <small class="cm-chat-size" data-cm-chat-size></small>
                    </div>
                </div>
            </div>
        </article>
    </template>

    <template data-cm-component="owner-group">
        <article class="cm-record-group cm-owner-group">
            <header class="cm-group-header">
                <div class="avatar cm-group-avatar">
                    <img loading="lazy" data-cm-owner-avatar>
                </div>
                <div class="cm-group-info">
                    <strong data-cm-owner-name></strong>
                    <span data-cm-owner-summary></span>
                </div>
                <button class="menu_button cm-group-toggle" type="button" aria-expanded="false" data-cm-owner-toggle>
                    <i class="fa-solid fa-chevron-down" aria-hidden="true" data-cm-group-chevron></i>
                    <span data-cm-group-toggle-text>展开</span>
                </button>
            </header>
            <div class="cm-group-children cm-hidden" data-cm-owner-children></div>
        </article>
    </template>

    <template data-cm-component="split-group">
        <article class="cm-record-group cm-split-group">
            <header class="cm-group-header">
                <div class="cm-group-icon" aria-hidden="true">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="cm-group-info">
                    <strong data-cm-split-group-name></strong>
                    <span data-cm-split-group-summary></span>
                    <small data-cm-split-group-incremental></small>
                </div>
                <div class="cm-actions">
                    <button class="menu_button" type="button" data-cm-split-continue>
                        <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
                        <span>增量分卷</span>
                    </button>
                    <button class="menu_button cm-group-toggle" type="button" aria-expanded="false" data-cm-split-toggle>
                        <i class="fa-solid fa-chevron-down" aria-hidden="true" data-cm-group-chevron></i>
                        <span data-cm-group-toggle-text>展开</span>
                    </button>
                </div>
            </header>
            <div class="cm-group-children cm-hidden" data-cm-split-children></div>
        </article>
    </template>

    <template data-cm-component="backup-row">
        <article class="cm-backup-row">
            <div class="cm-chat-info">
                <div class="cm-backup-heading">
                    <strong data-cm-backup-name></strong>
                    <span class="cm-status-badge" data-cm-backup-status></span>
                </div>
                <dl class="cm-backup-facts">
                    <div>
                        <dt>备份时间</dt>
                        <dd data-cm-backup-created></dd>
                    </div>
                    <div>
                        <dt>最后消息</dt>
                        <dd data-cm-backup-last-message></dd>
                    </div>
                    <div>
                        <dt>记录规模</dt>
                        <dd data-cm-backup-size></dd>
                    </div>
                </dl>
                <span class="cm-backup-reason" data-cm-backup-reason></span>
                <p class="cm-backup-preview" data-cm-backup-preview></p>
            </div>
            <div class="cm-actions">
                <button class="menu_button cm-primary-action" type="button" title="通过酒馆原生导入链路创建一份新聊天，不覆盖原记录" data-cm-backup-restore>
                    <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                    <span>恢复为新聊天</span>
                </button>
                <button class="menu_button" type="button" data-cm-backup-view>
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                    <span>查看内容</span>
                </button>
                <button class="menu_button" type="button" data-cm-backup-download>
                    <i class="fa-solid fa-download" aria-hidden="true"></i>
                    <span>下载文件</span>
                </button>
            </div>
        </article>
    </template>

    <template data-cm-component="message">
        <article class="cm-message">
            <header class="cm-message-header">
                <strong data-cm-message-name></strong>
                <time data-cm-message-date></time>
            </header>
            <pre data-cm-message-content></pre>
        </article>
    </template>

    <template data-cm-component="split-part">
        <div class="cm-preview-row">
            <span data-cm-split-part-text></span>
        </div>
    </template>

    <template data-cm-component="state">
        <div class="cm-state" role="status">
            <span data-cm-state-text></span>
        </div>
    </template>

    <template data-cm-component="recovery-task">
        <article class="cm-recovery">
            <div class="cm-chat-info">
                <strong data-cm-recovery-name></strong>
                <span data-cm-recovery-parts></span>
            </div>
            <div class="cm-actions">
                <button class="menu_button" type="button" data-cm-recovery-resume>
                    <i class="fa-solid fa-play" aria-hidden="true"></i>
                    <span>继续任务</span>
                </button>
                <button class="menu_button" type="button" data-cm-recovery-clear>
                    <i class="fa-solid fa-broom" aria-hidden="true"></i>
                    <span>清除任务记录</span>
                </button>
            </div>
        </article>
    </template>
</div>
