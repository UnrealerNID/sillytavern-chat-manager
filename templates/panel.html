<div id="chat_manager_overlay" class="cm-overlay cm-hidden" role="presentation">
    <section class="cm-panel" role="dialog" aria-modal="true" aria-labelledby="chat_manager_title">
        <header class="cm-header cm-panel-header">
            <div class="cm-title-block">
                <h2 id="chat_manager_title">
                    <i class="fa-solid fa-folder-tree" aria-hidden="true"></i>
                    <span>聊天文件管理</span>
                </h2>
            </div>
            <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-close>
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </header>

        <div class="cm-toolbar">
            <label class="cm-search-wrap">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input class="text_pole cm-search" type="search" placeholder="筛选角色、群组或聊天文件名" data-cm-search>
            </label>
            <div class="cm-list-options" role="group" aria-label="列表显示设置">
                <label class="cm-select-wrap" title="聊天排序方式">
                    <i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i>
                    <select class="text_pole cm-sort" aria-label="聊天排序方式" data-cm-sort>
                        <option value="newest">最新</option>
                        <option value="oldest">最早</option>
                        <option value="largest">文件最大</option>
                        <option value="messages">消息最多</option>
                        <option value="name">名称</option>
                    </select>
                </label>
                <label class="cm-select-wrap cm-page-size-wrap" title="每页显示条数">
                    <i class="fa-solid fa-table-list" aria-hidden="true"></i>
                    <select class="text_pole cm-page-size" aria-label="每页显示条数" data-cm-page-size>
                        <option value="20">20 条</option>
                        <option value="50">50 条</option>
                        <option value="100">100 条</option>
                    </select>
                </label>
            </div>
            <div class="cm-toolbar-actions">
                <div class="cm-scope-controls" role="radiogroup" aria-label="聊天显示范围">
                    <button class="menu_button" type="button" role="radio" aria-checked="false" data-cm-scope-current>
                        <i class="fa-solid fa-address-card" aria-hidden="true"></i>
                        <span data-cm-scope-current-label>当前角色</span>
                    </button>
                    <button class="menu_button" type="button" role="radio" aria-checked="false" data-cm-scope-all>
                        <i class="fa-solid fa-comments" aria-hidden="true"></i>
                        <span>全部聊天</span>
                    </button>
                </div>
                <div class="cm-view-controls" role="group" aria-label="聊天列表显示方式">
                    <button class="menu_button cm-icon-action" type="button" role="switch" title="按角色或群组分组显示" aria-label="按角色或群组分组显示" aria-checked="false" data-cm-group-owners>
                        <i class="fa-solid fa-address-book" aria-hidden="true"></i>
                    </button>
                    <button class="menu_button cm-icon-action" type="button" role="switch" title="按分卷组分组显示" aria-label="按分卷组分组显示" aria-checked="false" data-cm-group-splits>
                        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                    </button>
                </div>
                <button class="menu_button cm-icon-action" type="button" title="进入批量选择" aria-label="进入批量选择" aria-pressed="false" data-cm-batch-start>
                    <i class="fa-solid fa-square-check" aria-hidden="true"></i>
                </button>
                <button class="menu_button cm-icon-action cm-refresh-button" type="button" title="重新加载聊天列表" aria-label="重新加载聊天列表" data-cm-refresh>
                    <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <div class="cm-selection-toolbar cm-hidden" role="group" aria-label="批量选择操作" data-cm-selection-toolbar>
            <span class="cm-selection-count" role="status" aria-live="polite">
                <i class="fa-solid fa-square-check" aria-hidden="true"></i>
                <span data-cm-batch-count>已选 0 条</span>
            </span>
            <div class="cm-delete-controls">
                <button class="menu_button cm-icon-action" type="button" title="清空选择" aria-label="清空选择" disabled data-cm-batch-cancel>
                    <i class="fa-solid fa-eraser" aria-hidden="true"></i>
                </button>
                <button class="menu_button cm-icon-action cm-danger-action" type="button" title="删除已选" aria-label="删除已选" disabled data-cm-batch-confirm>
                    <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <div class="cm-state cm-hidden" role="status" aria-live="polite" data-cm-state></div>
        <main class="cm-chat-list" data-cm-list></main>

        <footer class="cm-footer cm-panel-footer">
            <div class="cm-panel-utilities">
                <button class="menu_button cm-icon-action" type="button" title="打开酒馆数据清理" aria-label="打开酒馆数据清理" data-cm-data-maid-open>
                    <i class="fa-solid fa-broom" aria-hidden="true"></i>
                </button>
                <div class="chat-manager-extension-meta">
                    <small class="chat-manager-extension-version" data-cm-version></small>
                    <button class="chat-manager-update-action" type="button" disabled data-cm-update>检查更新…</button>
                </div>
            </div>
            <nav class="cm-pagination" aria-label="聊天分页">
                <button class="menu_button cm-icon-action" type="button" title="上一页" aria-label="上一页" data-cm-previous>
                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                </button>
                <span class="cm-page-label" data-cm-page></span>
                <button class="menu_button cm-icon-action" type="button" title="下一页" aria-label="下一页" data-cm-next>
                    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
            </nav>
        </footer>
    </section>

</div>
