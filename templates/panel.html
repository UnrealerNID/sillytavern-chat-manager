<div id="chat_manager_overlay" class="cm-overlay cm-hidden" role="presentation">
    <section class="cm-panel" role="dialog" aria-modal="true" aria-labelledby="chat_manager_title">
        <header class="cm-header cm-panel-header">
            <div class="cm-title-block">
                <h2 id="chat_manager_title">
                    <i class="fa-solid fa-folder-tree" aria-hidden="true"></i>
                    <span>聊天文件管理</span>
                </h2>
            </div>
            <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-close>
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </header>

        <div class="cm-toolbar">
            <label class="cm-search-wrap">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input class="text_pole cm-search" type="search" placeholder="筛选角色、群组或聊天文件名" data-cm-search>
            </label>
            <div class="cm-toolbar-actions">
                <div class="cm-scope-controls" role="radiogroup" aria-label="聊天显示范围">
                    <button class="menu_button" type="button" role="radio" aria-checked="false" data-cm-scope-current>
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        <span data-cm-scope-current-label>当前角色</span>
                    </button>
                    <button class="menu_button" type="button" role="radio" aria-checked="false" data-cm-scope-all>
                        <i class="fa-solid fa-globe" aria-hidden="true"></i>
                        <span>全部聊天</span>
                    </button>
                </div>
                <div class="cm-view-controls" role="group" aria-label="聊天列表显示方式">
                    <button class="menu_button cm-toolbar-icon-action" type="button" role="switch" title="按角色或群组分组显示" aria-label="按角色或群组分组显示" aria-checked="false" data-cm-group-owners>
                        <i class="fa-solid fa-users" aria-hidden="true"></i>
                    </button>
                    <button class="menu_button cm-toolbar-icon-action" type="button" role="switch" title="按分卷组分组显示" aria-label="按分卷组分组显示" aria-checked="false" data-cm-group-splits>
                        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="cm-delete-controls" role="group" aria-label="批量删除聊天">
                    <button class="menu_button" type="button" data-cm-batch-start>
                        <i class="fa-solid fa-list-check" aria-hidden="true"></i>
                        <span>批量删除</span>
                    </button>
                    <button class="menu_button cm-hidden" type="button" data-cm-batch-cancel>取消选择</button>
                    <button class="menu_button cm-danger-action cm-hidden" type="button" disabled data-cm-batch-confirm>
                        <i class="fa-solid fa-trash" aria-hidden="true"></i>
                        <span data-cm-batch-count>删除已选（0）</span>
                    </button>
                </div>
                <button class="menu_button cm-toolbar-icon-action" type="button" title="打开酒馆数据清理" aria-label="打开酒馆数据清理" data-cm-data-maid-open>
                    <i class="fa-solid fa-broom" aria-hidden="true"></i>
                </button>
                <button class="menu_button cm-toolbar-icon-action cm-refresh-button" type="button" title="重新加载聊天列表" aria-label="重新加载聊天列表" data-cm-refresh>
                    <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <div class="cm-state cm-hidden" role="status" aria-live="polite" data-cm-state></div>
        <main class="cm-chat-list" data-cm-list></main>

        <footer class="cm-footer cm-panel-footer">
            <div class="chat-manager-extension-meta">
                <small class="chat-manager-extension-version" data-cm-version></small>
                <button class="chat-manager-update-action" type="button" disabled data-cm-update>检查更新…</button>
            </div>
            <nav class="cm-pagination" aria-label="聊天分页">
                <button class="menu_button" type="button" data-cm-previous>
                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                    <span>上一页</span>
                </button>
                <span class="cm-page-label" data-cm-page></span>
                <button class="menu_button" type="button" data-cm-next>
                    <span>下一页</span>
                    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
            </nav>
        </footer>
    </section>

</div>
