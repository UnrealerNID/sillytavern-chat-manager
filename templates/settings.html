<div id="chat_manager_extension_status" class="inline-drawer chat-manager-extension-status">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>聊天文件管理</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="chat-manager-extension-meta">
            <small class="chat-manager-extension-version"></small>
            <button id="chat_manager_update" class="chat-manager-update-action" type="button" disabled>检查更新…</button>
        </div>
        <label class="checkbox_label" for="chat_manager_enabled">
            <input id="chat_manager_enabled" class="checkbox" type="checkbox">
            <span>启用扩展</span>
        </label>
    </div>
</div>
