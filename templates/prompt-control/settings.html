<fieldset class="toolbox-module-card" data-toolbox-module="promptControl">
    <legend class="toolbox-module-legend">
        <i class="fa-solid fa-list-check"></i>
        <span>本轮提示词控制</span>
    </legend>
    <div class="toolbox-settings-row toolbox-module-enable">
        <span class="toolbox-settings-copy">
            <strong>启用模块</strong>
            <small>查看并临时控制本轮发送内容</small>
        </span>
        <label class="toolbox-switch" title="启用本轮提示词控制">
            <input data-prompt-control-enabled type="checkbox" role="switch">
            <span class="toolbox-switch-track"></span>
        </label>
    </div>
    <div data-prompt-control-features class="toolbox-feature-list">
        <div class="toolbox-settings-row">
            <span class="toolbox-settings-copy">
                <strong>悬浮气泡</strong>
                <small>关闭后将入口和面板固定在输入区</small>
            </span>
            <label class="toolbox-switch" title="使用悬浮气泡">
                <input data-prompt-floating-enabled type="checkbox" role="switch">
                <span class="toolbox-switch-track"></span>
            </label>
        </div>
    </div>
</fieldset>
