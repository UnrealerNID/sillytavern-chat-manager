<div id="prompt_control_host" class="prompt-control-host displayNone">
    <button
        data-prompt-control-trigger
        class="prompt-control-trigger"
        type="button"
        title="查看本轮提示词"
        aria-expanded="false"
    >
        <i class="fa-solid fa-brain"></i>
        <span data-prompt-control-trigger-tokens></span>
    </button>
    <section data-prompt-control-panel class="prompt-control-panel" hidden>
        <div class="prompt-control-resize-handles" aria-hidden="true">
            <span data-prompt-resize="n"></span>
            <span data-prompt-resize="e"></span>
            <span data-prompt-resize="s"></span>
            <span data-prompt-resize="w"></span>
            <span data-prompt-resize="ne"></span>
            <span data-prompt-resize="se"></span>
            <span data-prompt-resize="sw"></span>
            <span data-prompt-resize="nw"></span>
        </div>
        <header class="prompt-control-header">
            <div class="prompt-control-title">
                <strong>本轮提示词</strong>
                <small data-prompt-control-summary>尚未读取</small>
            </div>
            <div class="prompt-control-actions">
                <button
                    data-prompt-control-refresh
                    class="menu_button fa-solid fa-rotate-right"
                    type="button"
                    title="刷新本轮提示词"
                    aria-label="刷新本轮提示词"
                ></button>
                <button
                    data-prompt-control-clear
                    class="menu_button fa-solid fa-eraser"
                    type="button"
                    title="清空临时排除"
                    aria-label="清空临时排除"
                ></button>
                <button
                    data-prompt-control-collapse
                    class="menu_button fa-solid fa-chevron-down"
                    type="button"
                    title="收起面板"
                    aria-label="收起面板"
                ></button>
            </div>
        </header>
        <nav class="prompt-control-tabs" aria-label="提示词查看方式">
            <button data-prompt-view="prompt" class="menu_button selected" type="button">本轮提示词</button>
            <button data-prompt-view="position" class="menu_button" type="button">发送位置</button>
            <button data-prompt-view="source" class="menu_button" type="button">来源类型</button>
        </nav>
        <div data-prompt-control-status class="prompt-control-status" role="status"></div>
        <div data-prompt-control-content class="prompt-control-content"></div>
    </section>
</div>
