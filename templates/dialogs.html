<div data-cm-dialog-registry>
    <template data-cm-dialog-shell>
        <div class="cm-overlay cm-dialog-overlay" role="presentation" data-cm-dialog-overlay>
            <section class="cm-dialog" role="dialog" aria-modal="true" data-cm-dialog-panel>
                <header class="cm-header">
                    <h3 data-cm-dialog-title></h3>
                    <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-dialog-close>
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </header>
                <div class="cm-dialog-body" data-cm-dialog-body></div>
            </section>
        </div>
    </template>

    <template data-cm-dialog-content="backups">
        <div class="cm-state cm-loading-state" role="status" aria-live="polite" data-cm-backup-status>
            <span class="cm-loading-spinner" aria-hidden="true"></span>
            <div class="cm-loading-copy">
                <span data-cm-backup-status-text>正在读取备份列表…</span>
                <small data-cm-backup-elapsed>已等待 0.0 秒</small>
            </div>
            <div class="cm-loading-progress cm-loading-progress-indeterminate" role="progressbar" aria-label="备份扫描进度" data-cm-backup-progress>
                <span data-cm-backup-progress-value></span>
            </div>
        </div>
        <div class="cm-result-summary cm-hidden" data-cm-backup-summary></div>
        <div class="cm-result-list" data-cm-backup-results></div>
    </template>

    <template data-cm-dialog-content="backup-viewer">
        <div class="cm-message-list" data-cm-message-list></div>
        <div class="cm-footer cm-dialog-pagination">
            <button class="menu_button" type="button" data-cm-message-previous>上一页</button>
            <span data-cm-message-page></span>
            <button class="menu_button" type="button" data-cm-message-next>下一页</button>
        </div>
    </template>

    <template data-cm-dialog-content="split">
        <div class="cm-split-section-header">
            <div>
                <strong>分割参数</strong>
                <small>修改参数后会自动更新预览</small>
            </div>
            <span class="cm-status-badge" data-cm-split-preview-status>等待预览</span>
        </div>
        <div class="cm-split-form">
            <div class="cm-source-summary" data-cm-split-summary></div>
            <label class="cm-field cm-hidden" data-cm-split-group-config-field>
                <span>组配置</span>
                <select class="text_pole" data-cm-split-group-config></select>
            </label>
            <div class="cm-split-primary-fields">
                <label class="cm-field">
                    <span>模式</span>
                    <select class="text_pole" data-cm-split-mode>
                        <option value="range">指定范围</option>
                        <option value="fixed">固定楼层数</option>
                    </select>
                </label>
                <div class="cm-split-floor-fields">
                    <label class="cm-field">
                        <span>起始楼层 #</span>
                        <input class="text_pole" type="number" step="1" data-cm-split-start>
                    </label>
                    <label class="cm-field">
                        <span>结束楼层 #</span>
                        <input class="text_pole" type="number" step="1" data-cm-split-end>
                    </label>
                </div>
            </div>
            <label class="cm-field cm-hidden" data-cm-split-chunk-field>
                <span>每卷楼层数</span>
                <input class="text_pole" type="number" step="1" data-cm-split-chunk>
            </label>
        </div>
        <div class="cm-split-preview-header">
            <strong>分卷预览</strong>
            <small data-cm-split-preview-detail></small>
        </div>
        <div class="cm-preview" aria-live="polite" data-cm-split-preview></div>
        <div class="cm-split-notice" role="note">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
            <span>确认后会把预览中的分卷另存为新聊天，不会修改或删除原聊天；保存时酒馆会按自身设置生成备份，旧备份可能因保留数量上限被轮换清理。</span>
        </div>
        <div class="cm-dialog-actions">
            <button class="menu_button cm-primary-action" type="button" data-cm-split-confirm>
                <i class="fa-solid fa-scissors" aria-hidden="true"></i>
                <span>确认创建分卷</span>
            </button>
            <button class="menu_button cm-hidden" type="button" data-cm-split-stop>完成当前卷后停止</button>
        </div>
    </template>

    <template data-cm-dialog-content="recovery">
        <div data-cm-recovery-list></div>
    </template>

    <template data-cm-dialog-content="delete-chats">
        <div class="cm-delete-notice" role="note">
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
            <span>确认后将永久删除下列聊天文件，无法从聊天列表撤销；酒馆已有的备份不会随之删除，之后仍可通过“查找备份”恢复为新聊天。</span>
        </div>
        <div class="cm-delete-summary" data-cm-delete-summary></div>
        <div class="cm-delete-list" data-cm-delete-list></div>
        <div class="cm-dialog-actions">
            <button class="menu_button" type="button" data-cm-delete-cancel>取消</button>
            <button class="menu_button cm-danger-action" type="button" data-cm-delete-confirm>
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
                <span data-cm-delete-confirm-text>确认删除</span>
            </button>
        </div>
    </template>
</div>
