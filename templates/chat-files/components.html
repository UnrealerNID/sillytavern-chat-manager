<div data-cm-component-registry>
    <template data-cm-component="welcome-group-controls">
        <div class="cm-welcome-group-controls" role="group" aria-label="最近聊天分组方式">
            <button
                class="menu_button menu_button_icon"
                type="button"
                role="switch"
                title="按角色或群组显示"
                aria-label="按角色或群组显示"
                aria-checked="false"
                data-cm-welcome-group-owners
            >
                <i class="fa-solid fa-address-book" aria-hidden="true"></i>
            </button>
            <button
                class="menu_button menu_button_icon"
                type="button"
                role="switch"
                title="按分卷组显示"
                aria-label="按分卷组显示"
                aria-checked="false"
                data-cm-welcome-group-splits
            >
                <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
            </button>
        </div>
    </template>

    <template data-cm-component="chat-row">
        <article class="cm-chat-row">
            <label class="cm-chat-selector cm-hidden" title="选择这条聊天" data-cm-chat-select-wrap>
                <input type="checkbox" data-cm-chat-select>
            </label>
            <div class="avatar cm-chat-avatar">
                <img loading="lazy" data-cm-chat-avatar>
            </div>
            <div class="cm-chat-info">
                <div class="cm-chat-heading">
                    <div class="cm-chat-name" data-cm-chat-name>
                        <div class="cm-chat-owner-line">
                            <strong data-cm-chat-owner></strong>
                            <span class="cm-source-badge cm-hidden" data-cm-chat-source>源</span>
                            <span class="cm-chat-name-separator" aria-hidden="true">-</span>
                            <span class="cm-file-name" data-cm-chat-file></span>
                        </div>
                    </div>
                    <time class="cm-chat-date" data-cm-chat-date></time>
                    <div class="cm-actions cm-chat-actions">
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="进入聊天"
                            aria-label="进入聊天"
                            data-cm-chat-open
                        >
                            <i class="fa-solid fa-arrow-up-right-from-square fa-fw" aria-hidden="true"></i>
                        </button>
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="查看聊天内容"
                            aria-label="查看聊天内容"
                            data-cm-chat-view
                        >
                            <i class="fa-solid fa-eye fa-fw" aria-hidden="true"></i>
                        </button>
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="重命名聊天"
                            aria-label="重命名聊天"
                            data-cm-chat-rename
                        >
                            <i class="fa-solid fa-pen-to-square fa-fw" aria-hidden="true"></i>
                        </button>
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="查找对应备份"
                            aria-label="查找对应备份"
                            data-cm-chat-backups
                        >
                            <i class="fa-solid fa-box-archive fa-fw" aria-hidden="true"></i>
                        </button>
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="创建聊天分卷"
                            aria-label="创建聊天分卷"
                            data-cm-chat-split
                        >
                            <i class="fa-solid fa-scissors fa-fw" aria-hidden="true"></i>
                        </button>
                        <button
                            class="menu_button menu_button_icon cm-row-action cm-danger-action"
                            type="button"
                            title="永久删除这条聊天记录"
                            aria-label="删除聊天"
                            data-cm-chat-delete
                        >
                            <i class="fa-solid fa-trash-can fa-fw" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="cm-chat-message-row">
                    <p class="cm-chat-preview" data-cm-chat-preview></p>
                    <div class="cm-chat-stats">
                        <span data-cm-chat-count-wrap>
                            <i class="fa-solid fa-comment fa-xs" aria-hidden="true"></i>
                            <small data-cm-chat-count></small>
                        </span>
                        <small class="cm-chat-size" data-cm-chat-size></small>
                    </div>
                </div>
            </div>
        </article>
    </template>

    <template data-cm-component="owner-group">
        <article class="cm-record-group cm-owner-group">
            <header class="cm-group-header" data-cm-owner-header>
                <label class="cm-group-selector cm-hidden" title="选择该角色或群组的全部聊天" data-cm-owner-select-wrap>
                    <input type="checkbox" data-cm-owner-select>
                </label>
                <div class="avatar cm-group-avatar">
                    <img loading="lazy" data-cm-owner-avatar>
                </div>
                <div class="cm-group-info">
                    <strong data-cm-owner-name></strong>
                    <span data-cm-owner-summary></span>
                    <small data-cm-owner-latest></small>
                </div>
                <span class="cm-group-toggle" aria-hidden="true" data-cm-owner-toggle>
                    <i class="fa-solid fa-chevron-down" aria-hidden="true" data-cm-group-chevron></i>
                </span>
            </header>
            <div class="cm-group-children cm-hidden" data-cm-owner-children></div>
        </article>
    </template>

    <template data-cm-component="split-group">
        <article class="cm-record-group cm-split-group">
            <header class="cm-group-header" data-cm-split-header>
                <label class="cm-group-selector cm-hidden" title="选择该分卷组的全部聊天" data-cm-split-select-wrap>
                    <input type="checkbox" data-cm-split-select>
                </label>
                <div class="cm-group-icon" aria-hidden="true">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="cm-group-info">
                    <strong data-cm-split-group-name></strong>
                    <span data-cm-split-group-summary></span>
                    <small data-cm-split-group-latest></small>
                    <small data-cm-split-group-incremental></small>
                </div>
                <div class="cm-actions">
                    <button class="menu_button" type="button" data-cm-split-continue>
                        <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
                        <span>增量分卷</span>
                    </button>
                    <span class="cm-group-toggle" aria-hidden="true" data-cm-split-toggle>
                        <i class="fa-solid fa-chevron-down" aria-hidden="true" data-cm-group-chevron></i>
                    </span>
                </div>
            </header>
            <div class="cm-group-children cm-hidden" data-cm-split-children></div>
        </article>
    </template>

    <template data-cm-component="backup-row">
        <article class="cm-backup-row">
            <div class="cm-chat-info">
                <div class="cm-backup-heading">
                    <strong data-cm-backup-name></strong>
                    <span class="cm-status-badge" data-cm-backup-status></span>
                    <div class="cm-actions cm-backup-actions">
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="恢复为新聊天"
                            aria-label="恢复为新聊天"
                            data-cm-backup-restore
                        >
                            <i class="fa-solid fa-file-import fa-fw" aria-hidden="true"></i>
                        </button>
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="查看备份内容"
                            aria-label="查看备份内容"
                            data-cm-backup-view
                        >
                            <i class="fa-solid fa-eye fa-fw" aria-hidden="true"></i>
                        </button>
                        <button
                            class="menu_button menu_button_icon cm-row-action"
                            type="button"
                            title="下载备份文件"
                            aria-label="下载备份文件"
                            data-cm-backup-download
                        >
                            <i class="fa-solid fa-download fa-fw" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <dl class="cm-backup-facts">
                    <div>
                        <dt>备份时间</dt>
                        <dd data-cm-backup-created></dd>
                    </div>
                    <div>
                        <dt>最后消息</dt>
                        <dd data-cm-backup-last-message></dd>
                    </div>
                    <div>
                        <dt>记录规模</dt>
                        <dd data-cm-backup-size></dd>
                    </div>
                </dl>
                <span class="cm-backup-reason" data-cm-backup-reason></span>
                <p class="cm-backup-preview" data-cm-backup-preview></p>
            </div>
        </article>
    </template>

    <template data-cm-component="message">
        <article class="cm-message">
            <header class="cm-message-header">
                <strong data-cm-message-name></strong>
                <time data-cm-message-date></time>
            </header>
            <pre data-cm-message-content></pre>
        </article>
    </template>

    <template data-cm-component="split-part">
        <div class="cm-preview-row">
            <span data-cm-split-part-text></span>
        </div>
    </template>

    <template data-cm-component="delete-target">
        <article class="cm-delete-target">
            <div class="cm-chat-info">
                <strong data-cm-delete-owner></strong>
                <span data-cm-delete-file></span>
                <small data-cm-delete-facts></small>
            </div>
            <span class="cm-status-badge" data-cm-delete-status>等待删除</span>
        </article>
    </template>

    <template data-cm-component="state">
        <div class="cm-state" role="status">
            <span data-cm-state-text></span>
        </div>
    </template>

    <template data-cm-component="recovery-task">
        <article class="cm-recovery">
            <div class="cm-chat-info">
                <strong data-cm-recovery-name></strong>
                <span data-cm-recovery-parts></span>
            </div>
            <div class="cm-actions">
                <button class="menu_button" type="button" data-cm-recovery-resume>
                    <i class="fa-solid fa-play" aria-hidden="true"></i>
                    <span>继续任务</span>
                </button>
                <button class="menu_button" type="button" data-cm-recovery-clear>
                    <i class="fa-solid fa-broom" aria-hidden="true"></i>
                    <span>清除任务记录</span>
                </button>
            </div>
        </article>
    </template>
</div>
