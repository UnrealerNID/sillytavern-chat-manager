<fieldset class="toolbox-module-card" data-toolbox-module="chatFiles">
    <legend class="toolbox-module-legend">
        <i class="fa-solid fa-folder-tree"></i>
        <span>聊天文件管理</span>
    </legend>
    <div class="toolbox-settings-row toolbox-module-enable">
        <span class="toolbox-settings-copy">
            <strong>启用模块</strong>
            <small>聊天浏览、备份识别与分卷处理</small>
        </span>
        <label class="toolbox-switch" title="启用聊天文件管理">
            <input data-chat-files-enabled type="checkbox" role="switch">
            <span class="toolbox-switch-track"></span>
        </label>
    </div>
    <div data-chat-files-integrations class="toolbox-feature-list">
        <div class="toolbox-settings-row">
            <span class="toolbox-settings-copy">
                <strong>聊天文件快捷操作</strong>
                <small>在原生聊天文件列表加入备份与分卷操作</small>
            </span>
            <label class="toolbox-switch" title="启用聊天文件快捷操作">
                <input data-native-chat-panel-enabled type="checkbox" role="switch">
                <span class="toolbox-switch-track"></span>
            </label>
        </div>
        <div class="toolbox-settings-row">
            <span class="toolbox-settings-copy">
                <strong>欢迎页聊天分组</strong>
                <small>在最近聊天中加入角色与分卷分组</small>
            </span>
            <label class="toolbox-switch" title="启用欢迎页聊天分组">
                <input data-welcome-recent-enabled type="checkbox" role="switch">
                <span class="toolbox-switch-track"></span>
            </label>
        </div>
        <div class="toolbox-settings-row">
            <span class="toolbox-settings-copy">
                <strong>数据清理备份增强</strong>
                <small>在原生数据清理面板加入备份检查、查看与批量删除</small>
            </span>
            <label class="toolbox-switch" title="启用数据清理备份增强">
                <input data-data-maid-enabled type="checkbox" role="switch">
                <span class="toolbox-switch-track"></span>
            </label>
        </div>
    </div>
</fieldset>
