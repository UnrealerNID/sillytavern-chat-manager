<div id="chat_manager_inventory_overlay" class="cm-overlay cm-hidden" role="presentation">
    <section class="cm-panel cm-inventory-panel" role="dialog" aria-modal="true" aria-labelledby="chat_manager_inventory_title">
        <header class="cm-header cm-panel-header">
            <div class="cm-title-block">
                <h2 id="chat_manager_inventory_title">
                    <i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i>
                    <span>备份管理</span>
                </h2>
            </div>
            <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-inventory-close>
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </header>

        <div class="cm-inventory-modes" role="tablist" aria-label="备份管理功能">
            <button class="menu_button cm-active" type="button" role="tab" aria-selected="true" data-cm-inventory-mode="all">
                <i class="fa-solid fa-list" aria-hidden="true"></i>
                <span>全部备份</span>
            </button>
            <button class="menu_button" type="button" role="tab" aria-selected="false" data-cm-inventory-mode="orphan">
                <i class="fa-solid fa-link-slash" aria-hidden="true"></i>
                <span>孤立检查</span>
            </button>
        </div>

        <div class="cm-inventory-toolbar">
            <label class="cm-search-wrap">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input class="text_pole cm-search" type="search" placeholder="筛选备份文件名或状态" data-cm-inventory-search>
            </label>
            <select class="text_pole" aria-label="文件排序" data-cm-inventory-sort>
                <option value="oldest">最旧优先</option>
                <option value="latest">最新优先</option>
                <option value="largest">最大优先</option>
            </select>
            <button class="menu_button" type="button" data-cm-inventory-refresh data-cm-inventory-view="all">
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
                <span>刷新</span>
            </button>
        </div>

        <div class="cm-inventory-options cm-hidden" data-cm-inventory-orphan-actions>
            <button class="menu_button" type="button" data-cm-inventory-open-cleanup>
                <i class="fa-solid fa-broom" aria-hidden="true"></i>
                <span>清理孤立聊天</span>
            </button>
            <button class="menu_button" type="button" data-cm-inventory-scan-backups>
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <span>检查孤立备份</span>
            </button>
            <small class="cm-inventory-hint">
                <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                <span>孤立聊天交由酒馆原生数据清理处理；缺少完整性标识的旧备份会标记为“待确认”。</span>
            </small>
            <div class="cm-inventory-selection cm-hidden" data-cm-inventory-selection>
                <button class="menu_button" type="button" data-cm-inventory-select-all>全选当前结果</button>
                <button class="menu_button cm-danger-action" type="button" disabled data-cm-inventory-delete-selected>
                    <i class="fa-solid fa-trash" aria-hidden="true"></i>
                    <span data-cm-inventory-selected-count>删除已选（0）</span>
                </button>
            </div>
        </div>

        <div class="cm-inventory-tabs" role="tablist" aria-label="文件类型">
            <button class="menu_button cm-active" type="button" role="tab" aria-selected="true" data-cm-inventory-tab="backups" data-cm-inventory-view="all">
                <span>备份文件</span><small data-cm-inventory-backup-count>0</small>
            </button>
            <button class="menu_button cm-hidden" type="button" role="tab" aria-selected="false" data-cm-inventory-tab="orphanBackups" data-cm-inventory-view="orphan">
                <span>孤立备份</span><small data-cm-inventory-orphan-backup-count>0</small>
            </button>
        </div>

        <div class="cm-state cm-inventory-status cm-hidden" role="status" aria-live="polite" data-cm-inventory-status>
            <span class="cm-loading-spinner cm-hidden" aria-hidden="true" data-cm-inventory-spinner></span>
            <div class="cm-loading-copy">
                <span data-cm-inventory-status-text></span>
                <small data-cm-inventory-status-detail></small>
            </div>
            <div class="cm-loading-progress cm-hidden" role="progressbar" aria-label="文件读取进度" data-cm-inventory-progress>
                <span data-cm-inventory-progress-value></span>
            </div>
        </div>
        <main class="cm-inventory-list" data-cm-inventory-list></main>

        <footer class="cm-footer cm-inventory-footer">
            <div class="cm-inventory-summary">
                <span data-cm-inventory-summary></span>
            </div>
            <nav class="cm-pagination" aria-label="备份文件分页">
                <button class="menu_button" type="button" data-cm-inventory-previous>上一页</button>
                <span class="cm-page-label" data-cm-inventory-page></span>
                <button class="menu_button" type="button" data-cm-inventory-next>下一页</button>
            </nav>
        </footer>

        <template data-cm-inventory-row-template>
            <article class="cm-inventory-row">
                <label class="cm-inventory-selector cm-hidden" title="选择该孤立文件" data-cm-inventory-select-wrap>
                    <input type="checkbox" data-cm-inventory-select>
                </label>
                <div class="cm-inventory-file-icon" aria-hidden="true"><i data-cm-inventory-icon></i></div>
                <div class="cm-chat-info">
                    <div class="cm-inventory-heading">
                        <strong data-cm-inventory-name></strong>
                        <span class="cm-status-badge" data-cm-inventory-kind></span>
                    </div>
                    <span data-cm-inventory-owner></span>
                    <small data-cm-inventory-facts></small>
                </div>
                <div class="cm-actions cm-inventory-actions">
                    <button class="menu_button cm-inventory-action" type="button" data-cm-inventory-view-file>
                        <i class="fa-solid fa-eye" aria-hidden="true"></i><span>查看内容</span>
                    </button>
                    <button class="menu_button cm-inventory-action" type="button" data-cm-inventory-download>
                        <i class="fa-solid fa-download" aria-hidden="true"></i><span>下载文件</span>
                    </button>
                    <button class="menu_button cm-inventory-action cm-danger-action" type="button" data-cm-inventory-delete>
                        <i class="fa-solid fa-trash" aria-hidden="true"></i><span>删除</span>
                    </button>
                </div>
            </article>
        </template>

        <div class="cm-overlay cm-dialog-overlay cm-hidden" role="presentation" data-cm-inventory-viewer>
            <section class="cm-dialog cm-inventory-viewer" role="dialog" aria-modal="true" aria-labelledby="chat_manager_inventory_viewer_title">
                <header class="cm-header">
                    <h3 id="chat_manager_inventory_viewer_title" data-cm-inventory-viewer-title>查看内容</h3>
                    <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-inventory-viewer-close>
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </header>
                <div class="cm-result-summary" data-cm-inventory-viewer-summary></div>
                <div class="cm-message-list" data-cm-inventory-messages></div>
                <footer class="cm-footer cm-dialog-pagination">
                    <button class="menu_button" type="button" data-cm-inventory-message-previous>上一页</button>
                    <span data-cm-inventory-message-page></span>
                    <button class="menu_button" type="button" data-cm-inventory-message-next>下一页</button>
                </footer>
            </section>
        </div>

        <div class="cm-overlay cm-dialog-overlay cm-hidden" role="presentation" data-cm-inventory-delete-dialog>
            <section class="cm-dialog cm-inventory-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="chat_manager_inventory_delete_title">
                <header class="cm-header">
                    <h3 id="chat_manager_inventory_delete_title">删除孤立文件</h3>
                    <button class="cm-icon-button" type="button" title="关闭" aria-label="关闭" data-cm-inventory-delete-close>
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </header>
                <div class="cm-dialog-body">
                    <div class="cm-delete-notice" role="note">
                        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                        <span>确认后将永久删除所选文件。标记为“待确认”的旧备份无法自动判断归属，请先查看或下载后再决定。</span>
                    </div>
                    <div class="cm-delete-summary" data-cm-inventory-delete-summary></div>
                    <div class="cm-delete-list" data-cm-inventory-delete-list></div>
                    <div class="cm-dialog-actions">
                        <button class="menu_button" type="button" data-cm-inventory-delete-cancel>取消</button>
                        <button class="menu_button cm-danger-action" type="button" data-cm-inventory-delete-confirm>
                            <i class="fa-solid fa-trash" aria-hidden="true"></i><span>确认删除</span>
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <template data-cm-inventory-message-template>
            <article class="cm-message">
                <header class="cm-message-header"><strong data-cm-message-name></strong><time data-cm-message-date></time></header>
                <pre data-cm-message-content></pre>
            </article>
        </template>

        <template data-cm-inventory-delete-template>
            <article class="cm-delete-target">
                <div class="cm-chat-info"><strong data-cm-delete-name></strong><span data-cm-delete-kind></span><small data-cm-delete-facts></small></div>
                <span class="cm-status-badge" data-cm-delete-status>等待删除</span>
            </article>
        </template>
    </section>
</div>
